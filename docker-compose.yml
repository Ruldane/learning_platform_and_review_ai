# Tremplin : les 7 services de la spec (16.1). Images figées sur des versions précises (D30).
# `cp .env.example .env` puis `docker compose up -d` ; sans .env le back démarre sans clé LLM.

services:
  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8000
    ports:
      - "5173:5173"
    depends_on:
      - backend

  backend:
    build: ./backend
    env_file:
      - path: .env
        required: false
    environment:
      DATA_DIR: /data
      QDRANT_URL: http://qdrant:6333
      # Surchargeable depuis .env (macOS : http://host.docker.internal:11434, Ollama sur la machine).
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      SEARXNG_URL: http://searxng:8080
      GOTENBERG_URL: http://gotenberg:3000
    volumes:
      - app_data:/data
    ports:
      - "8000:8000"
    # Pas de dépendance à ollama-init : l'app répond pendant le téléchargement de bge-m3.
    depends_on:
      qdrant:
        condition: service_healthy
      ollama:
        condition: service_healthy
      searxng:
        condition: service_healthy
      gotenberg:
        condition: service_healthy

  qdrant:
    image: qdrant/qdrant:v1.20.0
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      # L'image n'a ni curl ni wget : requête HTTP à la main avec bash.
      test:
        - CMD
        - bash
        - -c
        - 'exec 3<>/dev/tcp/127.0.0.1/6333 && printf "GET /readyz HTTP/1.0\r\n\r\n" >&3 && read -r status <&3 && [[ $$status == *" 200 "* ]]'
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  ollama:
    image: ollama/ollama:0.40.16
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 10s

  ollama-init:
    image: ollama/ollama:0.40.16
    environment:
      OLLAMA_HOST: ollama:11434
    entrypoint: ["ollama"]
    command: ["pull", "bge-m3"]
    depends_on:
      ollama:
        condition: service_healthy
    restart: "no"

  searxng:
    image: searxng/searxng:2026.11.9-57ff753ad
    environment:
      # Service interne, jamais publié : une valeur fixe suffit.
      SEARXNG_SECRET: tremplin-searxng-reseau-interne
    volumes:
      - ./backend/infra/searxng/settings.yml:/etc/searxng/settings.yml:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  gotenberg:
    image: gotenberg/gotenberg:8.40.0
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  app_data:
  qdrant_data:
  ollama_data:
