# Tremplin : les 7 services de la spec (16.1). Images figées sur des versions précises (D30).
# `cp .env.example .env` puis `docker compose up -d` ; sans .env le back démarre sans clé LLM.
# Ports publiés sur 127.0.0.1 seulement, modifiables par FRONTEND_PORT, BACKEND_PORT et
# QDRANT_PORT (dans .env) ; CORS_ORIGIN (+ jumeau 127.0.0.1, D37) et l'adresse du back dans le
# bundle en dérivent (D36).

services:
  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:${BACKEND_PORT:-8000}
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-5173}:5173"
    depends_on:
      - backend

  backend:
    build: ./backend
    env_file:
      - path: .env
        required: false
    environment:
      DATA_DIR: /data
      QDRANT_URL: http://qdrant:6333
      # Lien du tableau de bord de Qdrant ouvert par le navigateur : suit QDRANT_PORT (D67).
      QDRANT_DASHBOARD_URL: ${QDRANT_DASHBOARD_URL:-http://localhost:${QDRANT_PORT:-6333}/dashboard}
      # Surchargeable depuis .env (macOS : http://host.docker.internal:11434, Ollama sur la machine).
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      SEARXNG_URL: http://searxng:8080
      GOTENBERG_URL: http://gotenberg:3000
      # Origine du front autorisée par CORS : suit FRONTEND_PORT, surchargeable depuis .env.
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:${FRONTEND_PORT:-5173}}
    volumes:
      - app_data:/data
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    # Pas de dépendance à ollama-init : l'app répond pendant le téléchargement de bge-m3.
    depends_on:
      qdrant:
        condition: service_healthy
      ollama:
        condition: service_healthy
      searxng:
        condition: service_healthy
      gotenberg:
        condition: service_healthy

  qdrant:
    image: qdrant/qdrant:v1.20.0
    ports:
      - "127.0.0.1:${QDRANT_PORT:-6333}:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      # L'image n'a ni curl ni wget : requête HTTP à la main avec bash.
      test:
        - CMD
        - bash
        - -c
        - 'exec 3<>/dev/tcp/127.0.0.1/6333 && printf "GET /readyz HTTP/1.0\r\n\r\n" >&3 && read -r status <&3 && [[ $$status == *" 200 "* ]]'
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  ollama:
    image: ollama/ollama:0.40.16
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 10s

  ollama-init:
    image: ollama/ollama:0.40.16
    environment:
      OLLAMA_HOST: ollama:11434
    entrypoint: ["ollama"]
    command: ["pull", "bge-m3"]
    depends_on:
      ollama:
        condition: service_healthy
    restart: "no"

  searxng:
    image: searxng/searxng:2026.11.9-57ff753ad
    environment:
      # Service interne, jamais publié : une valeur fixe suffit.
      SEARXNG_SECRET: tremplin-searxng-reseau-interne
    volumes:
      - ./backend/infra/searxng/settings.yml:/etc/searxng/settings.yml:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  gotenberg:
    image: gotenberg/gotenberg:8.40.0
    # Chromium rend des pages non fiables (repli du lecteur web, D72) : il ne doit joindre aucune
    # adresse interne, page ou sous-ressource (fetch, XHR, iframe, redirection) comprise.
    # 1. `--chromium-deny-private-ips` : refus selon l'adresse RÉSOLUE (boucle locale, RFC 1918,
    #    lien local dont 169.254.169.254, CGNAT, IPv6 locales), connexion épinglée sur l'adresse
    #    vérifiée par le proxy interne de Gotenberg (8.32+) ; c'est la garde principale.
    # 2. `--chromium-deny-list` : défense en profondeur, sur l'URL écrite (minuscules, sans
    #    identifiants) : `file:` ; tout hôte d'un seul label (services compose `backend`,
    #    `frontend`, `qdrant`, `ollama`, `searxng`, `gotenberg`, `localhost`, IPv4 décimale) ;
    #    `*.localhost`, `*.internal` (`host.docker.internal`), `*.local` ; IPv4 littérales
    #    0/8 (octal et hexadécimal compris), 10/8, 127/8, 169.254/16, 172.16/12, 192.168/16,
    #    100.64/10, 198.18/15 ; toute IPv6 littérale. Aucune virgule : Gotenberg y découpe la
    #    liste. `$$` : `$` échappé pour l'interpolation de compose.
    # 3. `downloadFrom` coupé (jamais utilisé). Chaque rendu a déjà son propre contexte de
    #    navigation (cookies, cache, stockage) : ne jamais activer `--chromium-shared-browser-context`.
    command:
      - gotenberg
      - --chromium-deny-private-ips=true
      - '--chromium-deny-list=^file:|^[a-z][a-z0-9+.-]*://([^/?#@]*@)?(([^/?#@.:\[]+|([a-z0-9-]+\.)*(localhost|internal|local))\.?(:[0-9]*)?([/?#]|$$)|(0[0-9a-fx]*|10|127|169\.254|172\.(1[6-9]|2[0-9]|3[01])|192\.168|100\.(6[4-9]|[7-9][0-9]|1[01][0-9]|12[0-7])|198\.1[89])\.|\[)'
      - --api-disable-download-from=true
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  app_data:
  qdrant_data:
  ollama_data:
