# Tremplin : les 7 services de la spec (16.1) plus le bac à sable de la phase 10 (10.A1). Images figées sur des versions précises (D30).
# `cp .env.example .env` puis `docker compose up -d` ; sans .env le back démarre sans clé LLM.
# Ports publiés sur 127.0.0.1 seulement, modifiables par FRONTEND_PORT, BACKEND_PORT et
# QDRANT_PORT (dans .env) ; CORS_ORIGIN (+ jumeau 127.0.0.1, D37) et l'adresse du back dans le
# bundle en dérivent (D36).

services:
  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:${BACKEND_PORT:-8000}
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-5173}:5173"
    depends_on:
      - backend

  backend:
    build: ./backend
    env_file:
      - path: .env
        required: false
    environment:
      DATA_DIR: /data
      QDRANT_URL: http://qdrant:6333
      # Lien du tableau de bord de Qdrant ouvert par le navigateur : suit QDRANT_PORT (D67).
      QDRANT_DASHBOARD_URL: ${QDRANT_DASHBOARD_URL:-http://localhost:${QDRANT_PORT:-6333}/dashboard}
      # Surchargeable depuis .env (macOS : http://host.docker.internal:11434, Ollama sur la machine).
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      SEARXNG_URL: http://searxng:8080
      GOTENBERG_URL: http://gotenberg:3000
      # Origine du front autorisée par CORS : suit FRONTEND_PORT, surchargeable depuis .env.
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:${FRONTEND_PORT:-5173}}
      # Connexion Google (mode `google` seulement, voir le README) : transmis depuis .env. Les
      # identifiants et la liste restent vides par défaut ; `AUTH_MODE` vaut `local` (une valeur
      # vide ferait refuser le démarrage), et les deux adresses suivent les ports publiés.
      AUTH_MODE: ${AUTH_MODE:-local}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      ALLOWED_EMAILS: ${ALLOWED_EMAILS:-}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:${FRONTEND_PORT:-5173}}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-http://localhost:${BACKEND_PORT:-8000}/api/v1/auth/google/callback}
    volumes:
      - app_data:/data
      # Volume d'échange avec le bac à sable (10.A1) : le back y dépose les travaux et en lit la
      # sortie. Le groupe 12345 est celui du dossier (2770 root:12345) ; le back n'a pas besoin
      # d'autre droit sur le bac (pas de socket Docker, pas de réseau commun).
      - sandbox_spool:/spool
    group_add:
      - "12345"
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    # Pas de dépendance à ollama-init : l'app répond pendant le téléchargement de bge-m3.
    depends_on:
      qdrant:
        condition: service_healthy
      ollama:
        condition: service_healthy
      searxng:
        condition: service_healthy
      gotenberg:
        condition: service_healthy
      # Le copy-up du volume d'échange (droits du dossier) a lieu au premier démarrage du bac.
      sandbox:
        condition: service_healthy

  qdrant:
    image: qdrant/qdrant:v1.20.0
    ports:
      - "127.0.0.1:${QDRANT_PORT:-6333}:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      # L'image n'a ni curl ni wget : requête HTTP à la main avec bash.
      test:
        - CMD
        - bash
        - -c
        - 'exec 3<>/dev/tcp/127.0.0.1/6333 && printf "GET /readyz HTTP/1.0\r\n\r\n" >&3 && read -r status <&3 && [[ $$status == *" 200 "* ]]'
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  ollama:
    image: ollama/ollama:0.40.16
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 10s

  ollama-init:
    image: ollama/ollama:0.40.16
    environment:
      OLLAMA_HOST: ollama:11434
    entrypoint: ["ollama"]
    command: ["pull", "bge-m3"]
    depends_on:
      ollama:
        condition: service_healthy
    restart: "no"

  searxng:
    image: searxng/searxng:2026.11.9-57ff753ad
    environment:
      # Service interne, jamais publié : une valeur fixe suffit.
      SEARXNG_SECRET: tremplin-searxng-reseau-interne
    volumes:
      - ./backend/infra/searxng/settings.yml:/etc/searxng/settings.yml:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  gotenberg:
    image: gotenberg/gotenberg:8.40.0
    # Chromium rend des pages non fiables (repli du lecteur web, D72) : il ne doit joindre aucune
    # adresse interne, page ou sous-ressource (fetch, XHR, iframe, redirection) comprise.
    # 1. `--chromium-deny-private-ips` : refus selon l'adresse RÉSOLUE (boucle locale, RFC 1918,
    #    lien local dont 169.254.169.254, CGNAT, IPv6 locales), connexion épinglée sur l'adresse
    #    vérifiée par le proxy interne de Gotenberg (8.32+) ; c'est la garde principale.
    # 2. `--chromium-deny-list` : défense en profondeur, au mieux, sur l'URL écrite (sans
    #    identifiants, casse ignorée par `(?i)`) : `file:` SAUF `file:///tmp/` (exception du
    #    défaut de Gotenberg, `^file:(?!//\/tmp/).*`, que cette liste remplace : `convert/html`
    #    et `convert/markdown`, PDF des leçons et des CV des phases 4 et 6, y naviguent ; les
    #    routes d'URL refusent `file://` d'elles-mêmes) ; tout hôte d'un seul label (services
    #    compose `backend`, `frontend`, `qdrant`, `ollama`, `searxng`, `gotenberg`, `localhost`,
    #    IPv4 décimale) ; `*.localhost`, `*.internal` (`host.docker.internal`), `*.local` ; IPv4
    #    littérales 0/8 (octal et hexadécimal compris), 10/8, 127/8, 169.254/16, 172.16/12,
    #    192.168/16, 100.64/10, 198.18/15 ; toute IPv6 littérale. Moteur `regexp2` (lookahead et
    #    `(?i)` acceptés, comme le défaut). Aucune virgule : Gotenberg y découpe la liste. `$$` :
    #    `$` échappé pour l'interpolation de compose.
    # 3. `downloadFrom` coupé (jamais utilisé). Chaque rendu a déjà son propre contexte de
    #    navigation (cookies, cache, stockage) : ne jamais activer `--chromium-shared-browser-context`.
    command:
      - gotenberg
      - --chromium-deny-private-ips=true
      - '--chromium-deny-list=(?i)^file:(?!//\/tmp/)|^[a-z][a-z0-9+.-]*://([^/?#@]*@)?(([^/?#@.:\[]+|([a-z0-9-]+\.)*(localhost|internal|local))\.?(:[0-9]*)?([/?#]|$$)|(0[0-9a-fx]*|10|127|169\.254|172\.(1[6-9]|2[0-9]|3[01])|192\.168|100\.(6[4-9]|[7-9][0-9]|1[01][0-9]|12[0-7])|198\.1[89])\.|\[)'
      - --api-disable-download-from=true
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  # Bac à sable d'exécution de code (phase 10, 10.A1) : le code de January ou de Claude tourne ici,
  # jamais dans le back. Rien n'y entre ni n'en sort sauf le volume d'échange `sandbox_spool` :
  # AUCUN réseau, AUCUN socket Docker, AUCUN dossier de l'hôte, AUCUN secret (pas d'`env_file`, pas
  # de variable d'environnement), AUCUN port publié. Image construite à la main (`docker build -t
  # learning_career_platform-sandbox:latest sandbox`) puis `docker compose up -d --no-build`.
  # Le lanceur est root SANS capacité sauf CHOWN, SETUID, SETGID et KILL (il change d'identité pour
  # le code, qui tourne en uid 20000 sans aucune capacité). Docker Desktop : le noyau est partagé
  # avec les autres conteneurs de la machine virtuelle WSL2 (pas de gVisor), voir D201.
  sandbox:
    build: ./sandbox
    image: learning_career_platform-sandbox:latest
    network_mode: none
    user: "0:12345"
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - KILL
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    memswap_limit: 512m
    cpus: 1.0
    pids_limit: 128
    # `nr_inodes` (en plus des valeurs du plan) : sans lui, une boucle qui crée des millions de
    # fichiers vides remplit la mémoire du noyau (inodes de tmpfs, hors des 64 Mo) et le noyau
    # tue tout le conteneur, lanceur compris (constaté, D201). `/dev/shm` : monté par Docker avec
    # le même défaut, donc redéclaré ici.
    tmpfs:
      - /work:size=64m,noexec,nosuid,nodev,nr_inodes=4096
      - /tmp:size=16m,noexec,nosuid,nodev,nr_inodes=2048
      - /dev/shm:size=64m,noexec,nosuid,nodev,nr_inodes=2048
    volumes:
      - sandbox_spool:/spool
    healthcheck:
      # Le lanceur bat le coeur chaque seconde : un battement de plus de 5 s = bac à l'arrêt.
      test:
        - CMD
        - python
        - -c
        - "import os, sys, time; sys.exit(0 if time.time() - os.stat('/spool/heartbeat').st_mtime < 5 else 1)"
      interval: 3s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  app_data:
  qdrant_data:
  ollama_data:
  sandbox_spool:
