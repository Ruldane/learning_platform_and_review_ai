# Hooks locaux uniquement (aucun dépôt distant). Les commandes passent par uv,
# donc aucune installation globale n'est requise (Windows + Git Bash compris).
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check (back)
        entry: uv run --directory backend ruff check
        language: system
        files: ^backend/
        types: [python]
        pass_filenames: false
      - id: ruff-format
        name: ruff format --check (back)
        entry: uv run --directory backend ruff format --check
        language: system
        files: ^backend/
        types: [python]
        pass_filenames: false
      - id: check-file-length
        name: longueur des fichiers et fonctions (back)
        # --project (et non --directory) : le répertoire courant reste la racine du dépôt,
        # les chemins transmis par pre-commit restent donc valides.
        entry: uv run --project backend python backend/scripts/check_file_length.py
        language: system
        files: ^backend/
        types: [python]
      - id: mypy
        name: mypy --strict (back)
        # mypy.exe est bloqué sous Windows : appel en module.
        entry: uv run --directory backend python -m mypy app
        language: system
        files: ^backend/
        types: [python]
        pass_filenames: false
      - id: lint-imports
        name: contrats d'import (back, import-linter)
        # Contrats dans backend/pyproject.toml ([tool.importlinter]). Appel par Python plutôt que
        # par lint-imports.exe, comme mypy (exécutables parfois bloqués sous Windows).
        entry: uv run --directory backend python -c "from importlinter.cli import lint_imports_command; lint_imports_command()"
        language: system
        # pyproject.toml compris : modifier un contrat relance la vérification.
        files: ^backend/(app/.*\.py|pyproject\.toml)$
        pass_filenames: false
      - id: openapi-contract
        name: contrat OpenAPI à jour (contracts/openapi.json)
        # Échoue si le back a changé sans régénérer le contrat : voir backend/scripts/export_openapi.py.
        entry: uv run --directory backend python -m scripts.export_openapi --check
        language: system
        files: ^(backend/|contracts/)
        pass_filenames: false
      - id: api-types
        name: types du front à jour (schema.d.ts = contracts/openapi.json)
        # Régénère les types dans un fichier temporaire et compare : voir
        # frontend/scripts/check-api-types.mjs. Corriger par `pnpm --dir frontend gen:api`.
        entry: pnpm --dir frontend gen:api:check
        language: system
        files: ^(contracts/openapi\.json|frontend/src/shared/api/schema\.d\.ts|frontend/scripts/check-api-types\.mjs)$
        pass_filenames: false
      - id: frontend-lint
        name: eslint (front)
        entry: pnpm --dir frontend lint
        language: system
        files: ^frontend/
        pass_filenames: false
      - id: frontend-typecheck
        name: tsc --noEmit (front)
        entry: pnpm --dir frontend typecheck
        language: system
        files: ^frontend/
        pass_filenames: false
