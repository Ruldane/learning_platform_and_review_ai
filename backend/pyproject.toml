[project]
name = "tremplin-backend"
version = "0.1.0"
description = "Backend FastAPI de Tremplin, plateforme locale d'apprentissage et de carrière."
requires-python = ">=3.12,<3.13"
dependencies = [
    "aiosqlite>=0.22.1",
    "alembic>=1.20.1",
    "anthropic>=2.8.0",
    "cryptography>=50.0.2",
    "fastapi>=0.162.4",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "langchain-anthropic>=1.7.10",
    "langchain-core>=1.7.7",
    "langchain-openai>=1.7.4",
    "openai>=3.49.0",
    "pydantic-settings>=2.16.2",
    "sqlalchemy[asyncio]>=2.1.8",
    "uvicorn[standard]>=0.54.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
testpaths = ["tests"]
addopts = "--import-mode=importlib"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
strict = true
python_version = "3.12"

[dependency-groups]
dev = [
    "asgi-lifespan>=2.1.0",
    "import-linter>=2.16",
    "mypy>=2.4.1",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "pyyaml>=6.0.3",
    "respx>=0.23.1",
    "ruff>=0.17.4",
]

# Contrats d'import (plan directeur, 1.2), bloquants en pre-commit (`lint-imports`).
# À étendre à chaque nouvelle feature ou fournisseur concret ; `app.agents` s'ajoutera aux
# contrats 3 et 4 quand le paquet existera (import-linter refuse un module absent).
[tool.importlinter]
root_packages = ["app"]
include_external_packages = false

[[tool.importlinter.contracts]]
id = "couches-feature"
name = "1a. Couches de chaque feature : router -> service -> repository"
type = "layers"
containers = ["app.features.auth", "app.features.health", "app.features.settings"]
layers = [
    "(router) | (keys_router)",
    "(service) | (keys_service)",
    "(repository) | (keys_repository)",
]

[[tool.importlinter.contracts]]
id = "router-sans-base"
name = "1b. Un router n'importe jamais un repository ni app.db"
type = "forbidden"
source_modules = ["app.features.*.router", "app.features.*.keys_router"]
forbidden_modules = [
    "app.db",
    "app.features.*.repository",
    "app.features.*.keys_repository",
]
# Le service, lui, importe le repository : seule l'importation directe est interdite.
allow_indirect_imports = true

[[tool.importlinter.contracts]]
id = "features-independantes"
name = "2. Une feature n'importe d'une autre feature que son service"
type = "independence"
modules = ["app.features.auth", "app.features.health", "app.features.settings"]
ignore_imports = [
    "app.features.** -> app.features.*.service",
    "app.features.** -> app.features.*.keys_service",
]

[[tool.importlinter.contracts]]
id = "features-sans-fournisseur-concret"
name = "3. app.features n'importe jamais une implémentation concrète de app.providers"
type = "forbidden"
source_modules = ["app.features"]
forbidden_modules = [
    "app.providers.llm.anthropic",
    "app.providers.llm.openai",
    "app.providers.llm.glm",
    "app.providers.llm.fake",
    "app.providers.llm.registry",
    "app.providers.embeddings.ollama_probe",
    "app.providers.vector.qdrant_probe",
    "app.providers.search.searxng_probe",
    "app.providers.pdf.gotenberg_probe",
]

[[tool.importlinter.contracts]]
id = "fournisseurs-sans-feature"
name = "4. app.providers n'importe jamais app.features"
type = "forbidden"
source_modules = ["app.providers"]
forbidden_modules = ["app.features"]

[[tool.importlinter.contracts]]
id = "composition-isolee"
name = "5. Seul app.main importe app.bootstrap (composition)"
type = "forbidden"
source_modules = ["app.core", "app.db", "app.features", "app.providers"]
forbidden_modules = ["app.bootstrap"]
