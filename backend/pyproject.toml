[project]
name = "tremplin-backend"
version = "0.1.0"
description = "Backend FastAPI de Tremplin, plateforme locale d'apprentissage et de carrière."
requires-python = ">=3.12,<3.13"
dependencies = [
    "aiosqlite>=0.22.1",
    "alembic>=1.20.1",
    "anthropic>=2.8.0",
    "cryptography>=50.0.2",
    "defusedxml>=0.7.1",
    "fastapi>=0.162.4",
    "httpx>=0.28.1",
    "icalendar>=7.3.0",
    "jinja2>=3.1.6",
    "langchain-anthropic>=1.7.10",
    "langchain-core>=1.7.7",
    "langchain-openai>=1.7.4",
    "langgraph>=1.2.20",
    "langgraph-checkpoint-sqlite>=3.1.3",
    "numpy>=2.5.4",
    "openai>=3.49.0",
    "pdfplumber>=0.11.10",
    "pydantic-settings>=2.16.2",
    "python-docx>=1.2.0",
    "python-multipart>=0.0.33",
    "qdrant-client>=1.20.0",
    "sqlalchemy[asyncio]>=2.1.8",
    "trafilatura>=2.3.1",
    "uvicorn[standard]>=0.54.0",
    "youtube-transcript-api>=1.2.5",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
testpaths = ["tests"]
addopts = "--import-mode=importlib -m 'not live'"
markers = ["live: touche un vrai service (désélectionné par défaut)"]
# Le mode local `:memory:` des tests ignore les index de payload et le dit : bruit sans intérêt.
filterwarnings = ["ignore:Payload indexes have no effect in the local Qdrant:UserWarning"]
# Un test bloqué (WebSocket, attente sans fin) échoue au lieu de geler la suite ; méthode
# « thread » : Windows n'a pas SIGALRM.
timeout = 60
timeout_method = "thread"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
strict = true
python_version = "3.12"

[dependency-groups]
dev = [
    "asgi-lifespan>=2.1.0",
    "import-linter>=2.16",
    "mypy>=2.4.1",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "pytest-timeout>=2.4.0",
    "pyyaml>=6.0.3",
    "respx>=0.23.1",
    "ruff>=0.17.4",
    "types-defusedxml>=0.7.0.20260504",
]

# Contrats d'import (plan directeur, 1.2), bloquants en pre-commit (`lint-imports`).
# Les contrats 1a et 2 couvrent toute feature (`app.features.*`) sans la nommer ; le contrat 3
# est à étendre à chaque fournisseur concret ; `app.agents` figure dans les contrats 3, 4 et 5.
[tool.importlinter]
root_packages = ["app"]
include_external_packages = false

[[tool.importlinter.contracts]]
id = "couches-feature"
name = "1a. Couches de chaque feature : router -> service -> repository"
type = "layers"
# Joker : toute nouvelle feature est vérifiée sans modifier ce fichier (`registry`, simple
# module, n'a aucune couche : elles sont toutes optionnelles).
containers = ["app.features.*"]
layers = [
    "(router) | (keys_router)",
    "(service) | (keys_service)",
    "(repository) | (keys_repository)",
]

[[tool.importlinter.contracts]]
id = "router-sans-base"
name = "1b. Un router n'importe jamais un repository ni app.db"
type = "forbidden"
source_modules = ["app.features.*.router", "app.features.*.keys_router"]
forbidden_modules = [
    "app.db",
    "app.features.*.repository",
    "app.features.*.keys_repository",
]
# Le service, lui, importe le repository : seule l'importation directe est interdite.
allow_indirect_imports = true

[[tool.importlinter.contracts]]
id = "features-independantes"
name = "2. Une feature n'importe d'une autre feature que son service"
type = "independence"
modules = ["app.features.*"]
# Les motifs `.**` couvrent un service devenu paquet ; tant qu'aucun ne l'est, ils ne
# correspondent à rien : simple avertissement plutôt qu'échec.
unmatched_ignore_imports_alerting = "warn"
ignore_imports = [
    "app.features.** -> app.features.*.service",
    "app.features.** -> app.features.*.service.**",
    "app.features.** -> app.features.*.keys_service",
    "app.features.** -> app.features.*.keys_service.**",
    # Le registre monte les routeurs de toutes les features : c'est son rôle.
    "app.features.registry -> app.features.**",
]

[[tool.importlinter.contracts]]
id = "features-sans-fournisseur-concret"
name = "3. app.features, app.agents et app.realtime n'importent jamais une implémentation concrète de app.providers"
type = "forbidden"
source_modules = ["app.features", "app.agents", "app.realtime"]
forbidden_modules = [
    "app.providers.llm.anthropic",
    "app.providers.llm.openai",
    "app.providers.llm.glm",
    "app.providers.llm.fake",
    "app.providers.llm.registry",
    "app.providers.embeddings.ollama_probe",
    "app.providers.vector.qdrant_probe",
    "app.providers.embeddings.ollama",
    "app.providers.embeddings.fake",
    "app.providers.vector.qdrant",
    "app.providers.search.searxng_probe",
    "app.providers.search.searxng",
    "app.providers.search.brave",
    "app.providers.search.fake",
    "app.providers.pdf.gotenberg_probe",
    "app.providers.storage.local",
    "app.providers.pdf.extract",
    "app.providers.pdf.subprocess",
    "app.providers.pdf.worker",
    "app.providers.pdf.gotenberg",
    "app.providers.web.fetch",
    "app.providers.web._body",
    "app.providers.web.transport",
    "app.providers.web.reader",
    "app.providers.web.youtube",
    "app.providers.web.throttle",
    "app.providers.web.github",
    "app.providers.web.arxiv",
    "app.providers.web.routing",
]

[[tool.importlinter.contracts]]
id = "fournisseurs-sans-feature"
name = "4. app.providers n'importe jamais app.features, app.agents ni app.realtime"
type = "forbidden"
source_modules = ["app.providers"]
forbidden_modules = ["app.features", "app.agents", "app.realtime"]

[[tool.importlinter.contracts]]
id = "moteur-sans-feature"
name = "6. app.agents n'importe jamais app.features (réglages fournis par la composition)"
type = "forbidden"
source_modules = ["app.agents"]
forbidden_modules = ["app.features"]

[[tool.importlinter.contracts]]
id = "composition-isolee"
name = "5. Seul app.main importe app.bootstrap (composition)"
type = "forbidden"
source_modules = ["app.core", "app.db", "app.features", "app.agents", "app.realtime", "app.providers"]
forbidden_modules = ["app.bootstrap"]
